name: Atualizar Stats

on:
  schedule:
    - cron: '0 6 * * *'   # diariamente, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificação do token
        run: |
          if [ -z "${{ secrets.STATS_TOKEN }}" ]; then
            echo "❌ STATS_TOKEN ausente — adicione um PAT (read dos repos) nos Secrets."
            exit 1
          else
            echo "✅ STATS_TOKEN detectado"
          fi

      - name: Gerar cards de stats (todos os repos, incl. privados)
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Commit dos SVGs atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg
          git commit -m "chore: atualiza stats [skip ci]" || { echo "Sem mudanças."; exit 0; }
          git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
